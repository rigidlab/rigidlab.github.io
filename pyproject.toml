[project]
name = "rigidlab-site"
version = "0.1.0"
description = "rigidlab.github.io - portfolio, blog and projects"
readme = "CLAUDE.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    # MkDocs 2.0 removes the plugin and theming systems with no migration path,
    # so Material is pinned to the 1.x line until that shakes out.
    "mkdocs<2",
    "mkdocs-material>=9.5,<10",
    "mkdocs-glightbox>=0.4",
    "pymdown-extensions>=10.7",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
