site_name: rigidlab
site_description: Robotics, simulation, and things I build to understand a problem better
site_url: https://rigidlab.github.io/
theme:
  name: material
  favicon: media/rigidlab.svg
  logo: media/rigidlab.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

markdown_extensions:
  - tables
  - md_in_html
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      linenums: false
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets:
      base_path: 'docs/'
  - pymdownx.superfences:
      custom_fences:
      - name: mermaid
        class: mermaid
        format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: 'index.md'
  - Projects:
    - projects/index.md
  - Blog:
    - blog/index.md

extra:
  analytics:
    provider: google
    property: G-V55C7EE2NV

extra_css:
  - stylesheets/extra.css
  - stylesheets/present.css
  - stylesheets/walkthrough.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - javascripts/present.js
  - javascripts/walkthrough.js

# Plugins
plugins:
  - blog:
      blog_dir: blog
      blog_toc: false
      post_url_format: "{date}/{slug}"
      pagination: true
      categories: true
      categories_name: Topics
      archive: true
  - glightbox
  - search:
      separator: '[\s\u200b\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
